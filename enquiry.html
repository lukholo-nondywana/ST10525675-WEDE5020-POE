<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Send an enquiry to Premier Football Academy about our training programmes.">
    <title>Premier Football Academy - Enquiry</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="index.html">Premier <span>Football</span> Academy</a>
            <nav class="site-nav" aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="service.html">Services</a></li>
                    <li><a href="enquiry.html" class="active" aria-current="page">Enquiry</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main">
        <section class="container">
            <h1>Make an Enquiry</h1>
            <p>
                Complete the form below if you would like
                more information about our programmes.
            </p>

            <form class="enquiry-card">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone">
                </div>

                <div class="form-group">
                    <label for="programme">Programme</label>
                    <select id="programme" name="programme">
                        <option value="">Select a programme</option>
                        <option value="football-training">Football Training</option>
                        <option value="youth-development">Youth Development</option>
                        <option value="skills-development">Skills Development</option>
                        <option value="coaching-programmes">Coaching Programmes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6"></textarea>
                </div>

                <button type="submit">Submit Enquiry</button>

            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Premier Football Academy. All rights reserved.</p>
        <p>Gqeberha, South Africa</p>
    </footer>

    <script src="JS/script.js"></script>
</body>

</html>
